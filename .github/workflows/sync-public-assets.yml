name: Sync Public Website Assets

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/download-public-assets.sh"
      - ".github/workflows/sync-public-assets.yml"

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download public assets
        run: bash scripts/download-public-assets.sh

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Store public website assets locally"
          git push
