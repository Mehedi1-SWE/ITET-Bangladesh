name: Discover ITET Live API

on:
  push:
    paths:
      - ".github/workflows/discover-live-api.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live JavaScript bundles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import urllib.request
          from pathlib import Path

          base = "https://itetbd.net"
          pages = ["committee", "welfareTrust", "gallery", "notices", "events"]
          script_urls = set()

          for page in pages:
              html = urllib.request.urlopen(f"{base}/{page}", timeout=30).read().decode("utf-8", "ignore")
              script_urls.update(re.findall(r'src="(/_next/static/chunks/[^"]+\.js)"', html))

          print("scripts", len(script_urls))
          chunks = []
          for src in sorted(script_urls):
              try:
                  text = urllib.request.urlopen(base + src, timeout=30).read().decode("utf-8", "ignore")
                  chunks.append((src, text))
              except Exception as exc:
                  print("FETCH_FAIL", src, exc)

          patterns = [
              re.compile(r'https?://[^"\'\s)]+'),
              re.compile(r'/api/[A-Za-z0-9_./?=&:%-]+'),
          ]

          print("=== API-like paths ===")
          matches = set()
          for src, text in chunks:
              for pattern in patterns:
                  for value in pattern.findall(text):
                      low = value.lower()
                      if any(k in low for k in ["api", "itet", "gallery", "committee", "trust", "notice", "event"]):
                          matches.add(value)
          for value in sorted(matches):
              print(value)

          for label, words in [
              ("committee context", ["committee","trustee","welfare"]),
              ("gallery context", ["gallery","photograph","loadmore","pagesize"]),
          ]:
              print("===", label, "===")
              count = 0
              for src, text in chunks:
                  low = text.lower()
                  for word in words:
                      start = 0
                      while count < 250:
                          pos = low.find(word, start)
                          if pos < 0:
                              break
                          print(src, text[max(0,pos-180):pos+360].replace("\n"," "))
                          count += 1
                          start = pos + len(word)
                      if count >= 250:
                          break
                  if count >= 250:
                      break
          PY

      - name: Print exact committee component context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request
          base="https://itetbd.net"
          html=urllib.request.urlopen(base+"/committee", timeout=30).read().decode("utf-8","ignore")
          scripts=sorted(set(re.findall(r'src="(/_next/static/chunks/[^"]+\.js)"', html)))
          for src in scripts:
              try:
                  text=urllib.request.urlopen(base+src, timeout=30).read().decode("utf-8","ignore")
              except Exception:
                  continue
              if "useInterimData" in text or "No committee member found" in text:
                  print("CHUNK",src)
                  for needle in ["useInterimData","No committee member found","Executive Committee Members"]:
                      pos=text.find(needle)
                      if pos>=0:
                          print("NEEDLE",needle,"AT",pos)
                          print(text[max(0,pos-6000):pos+14000])
          PY


  inspect-remaining:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect remaining live routes and gallery payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request, html, json

          base="https://itetbd.net"

          # Exact navbar membership block from current live chunk.
          home=urllib.request.urlopen(base, timeout=30).read().decode("utf-8","ignore")
          scripts=sorted(set(re.findall(r'src="(/_next/static/chunks/[^"]+\.js)"', home)))
          for src in scripts:
              try:
                  text=urllib.request.urlopen(base+src, timeout=30).read().decode("utf-8","ignore")
              except Exception:
                  continue
              pos=text.find('{label:"Membership",hasDropdown')
              if pos>=0:
                  print("=== EXACT MEMBERSHIP NAV ===")
                  print(text[pos:pos+5000])

          # Server-rendered content for missing membership routes.
          for route in ["general-membership","renew-membership"]:
              try:
                  body=urllib.request.urlopen(f"{base}/{route}", timeout=30).read().decode("utf-8","ignore")
                  print(f"=== {route} HTML LENGTH {len(body)} ===")
                  stripped=re.sub(r'<script.*?</script>',' ',body,flags=re.S|re.I)
                  stripped=re.sub(r'<style.*?</style>',' ',stripped,flags=re.S|re.I)
                  stripped=re.sub(r'<[^>]+>',' ',stripped)
                  stripped=html.unescape(re.sub(r'\s+',' ',stripped))
                  print(stripped[:16000])
              except Exception as exc:
                  print(route,"FETCH_FAIL",exc)

          # Find every serialized gallery URL in the current gallery HTML, not only rendered <img> tags.
          body=urllib.request.urlopen(base+"/gallery", timeout=30).read().decode("utf-8","ignore")
          urls=[]
          for raw in re.findall(r'https?[^"\\\s<>]+', body):
              value=html.unescape(raw).replace('\\u0026','&').replace('\\/','/')
              if "res.cloudinary.com" in value or "postimg.cc" in value:
                  value=value.rstrip('),]}')
                  if value not in urls: urls.append(value)
          print("=== SERIALIZED GALLERY URL COUNT ===",len(urls))
          for i,u in enumerate(urls,1):
              print(f"GALLERY_URL_{i:02d}",u)
          PY
