          curl -L --fail --retry 3 "https://res.cloudinary.com/du04p5ikw/image/upload/v1757614581/WhatsApp_Image_2025-09-09_at_10.28.37_PM_1_vr5w1s.jpg" -o public/images/gallery/gallery-34.jpg
