name: Capture Live ITET Reference

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/capture-live-reference.sh"
      - ".github/workflows/capture-live-reference.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture live HTML and CSS
        run: bash scripts/capture-live-reference.sh
      - name: Commit reference snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/live-site
          if git diff --cached --quiet; then
            echo "No reference changes."
            exit 0
          fi
          git commit -m "Capture live ITET homepage reference"
          git push
