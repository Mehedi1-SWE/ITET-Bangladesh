          curl -L --fail --retry 3 "https://res.cloudinary.com/du04p5ikw/image/upload/v1757614589/WhatsApp_Image_2025-09-09_at_10.05.01_PM_taovks.jpg" -o public/images/gallery/gallery-46.jpg
          file public/images/gallery/gallery-{23..46}.jpg
      - name: Commit full gallery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/gallery/gallery-{23..46}.jpg
          if git diff --cached --quiet; then
            echo "Gallery already complete."
            exit 0
          fi
          git commit -m "Add remaining official gallery photographs"
          git push
