          curl -L --fail --retry 3 "https://res.cloudinary.com/du04p5ikw/image/upload/v1757614579/WhatsApp_Image_2025-09-09_at_10.28.40_PM_zwlta9.jpg" -o public/images/gallery/gallery-30.jpg
          curl -L --fail --retry 3 "https://res.cloudinary.com/du04p5ikw/image/upload/v1757614580/WhatsApp_Image_2025-09-09_at_10.28.38_PM_1_okjg9b.jpg" -o public/images/gallery/gallery-31.jpg
