name: Sync Full ITET Gallery

on:
  push:
    paths:
      - ".github/workflows/sync-gallery-full.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download remaining official gallery photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/gallery
          curl -L --fail --retry 3 "https://res.cloudinary.com/du04p5ikw/image/upload/v1757614574/WhatsApp_Image_2025-09-09_at_10.34.44_PM_o93rqt.jpg" -o public/images/gallery/gallery-23.jpg
          curl -L --fail --retry 3 "https://res.cloudinary.com/du04p5ikw/image/upload/v1757614575/WhatsApp_Image_2025-09-09_at_10.32.23_PM_tbma4v.jpg" -o public/images/gallery/gallery-24.jpg
          curl -L --fail --retry 3 "https://res.cloudinary.com/du04p5ikw/image/upload/v1757614576/WhatsApp_Image_2025-09-09_at_10.28.42_PM_1_ddgbbt.jpg" -o public/images/gallery/gallery-25.jpg
          curl -L --fail --retry 3 "https://res.cloudinary.com/du04p5ikw/image/upload/v1757614577/WhatsApp_Image_2025-09-09_at_10.32.22_PM_rvv2in.jpg" -o public/images/gallery/gallery-26.jpg
