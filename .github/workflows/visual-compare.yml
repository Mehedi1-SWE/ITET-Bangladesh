name: Visual Compare

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "components/**"
      - "public/**"
      - "reference/live-site/**"
      - ".github/workflows/visual-compare.yml"

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build static live reference
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote
          import re

          root = Path("reference/live-site")
          html = (root / "home.html").read_text(errors="ignore")

          stream_marker = html.find('id="S:0"')
          content_start = html.find('<div class="bg-white">', stream_marker if stream_marker >= 0 else 0)
          cta = html.find("Empower Your Textile Career Today", content_start)
          content_end = html.find("</section>", cta)

          header_start = html.find('<div class="hidden xl:block">')
          header_end = html.find("</header>", header_start)

          footer_start = html.find('<footer class="relative bg-[#050813]')
          footer_end = html.find("</footer>", footer_start)

          if min(content_start, cta, content_end, header_start, header_end, footer_start, footer_end) < 0:
              raise SystemExit(
                  f"Could not locate live regions: content={content_start}, cta={cta}, "
                  f"header={header_start}, footer={footer_start}"
              )

          header = html[header_start:header_end + len("</header>")]
          content = html[content_start:content_end + len("</section>")]
          footer = html[footer_start:footer_end + len("</footer>")]
          body = header + content + footer

          body = re.sub(r'\s+srcSet="[^"]*"', "", body)
          body = re.sub(r'\s+sizes="[^"]*"', "", body)
          body = re.sub(r'\s+loading="lazy"', "", body)

          def convert_src(match):
              encoded = match.group(1)
              decoded = unquote(encoded.replace("&amp;", "&"))
              if decoded == "/hero-building-bg.jpg":
                  return 'src="http://127.0.0.1:3000/images/home/itet-architecture.jpg"'
              if "itet-logo" in decoded:
                  return 'src="http://127.0.0.1:3000/images/logo/itet-logo.jpg"'
              if "footer-bg" in decoded:
                  return 'src="http://127.0.0.1:3000/images/home/hero-texture.jpg"'
              if decoded.startswith("http://") or decoded.startswith("https://"):
                  return f'src="{decoded}"'
              return f'src="{decoded}"'

          body = re.sub(
              r'src="/_next/image\?url=([^"&]+)(?:&amp;|&)w=[^"]*"',
              convert_src,
              body
          )

          css_links = "\n".join(
              f'<link rel="stylesheet" href="/css/{p.name}">'
              for p in sorted((root / "css").glob("*.css"))
          )

          page = f"""<!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            {css_links}
            <style>
              html,body{{margin:0;padding:0}}
              body{{background:#fff}}
            </style>
          </head>
          <body>{body}</body>
          </html>"""
          (root / "static.html").write_text(page)
          PY

      - name: Start local servers
        run: |
          npm run start > /tmp/itet-next.log 2>&1 &
          python -m http.server 4000 --directory reference/live-site > /tmp/reference.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null && curl -fsS http://127.0.0.1:4000/static.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/itet-next.log
          cat /tmp/reference.log
          exit 1

      - name: Capture reference and local screenshots
        run: |
          mkdir -p visual
          npx playwright screenshot --browser chromium --viewport-size="1440,900" --full-page http://127.0.0.1:4000/static.html visual/reference-desktop.png
          npx playwright screenshot --browser chromium --viewport-size="1440,900" --full-page http://127.0.0.1:3000 visual/local-desktop.png
          npx playwright screenshot --browser chromium --viewport-size="390,844" --full-page http://127.0.0.1:4000/static.html visual/reference-mobile.png
          npx playwright screenshot --browser chromium --viewport-size="390,844" --full-page http://127.0.0.1:3000 visual/local-mobile.png

      - name: Calculate visual difference
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image, ImageChops, ImageStat
          import json

          pairs = [
              ("desktop", "visual/reference-desktop.png", "visual/local-desktop.png"),
              ("mobile", "visual/reference-mobile.png", "visual/local-mobile.png"),
          ]
          report = {}
          for name, ref_path, local_path in pairs:
              ref = Image.open(ref_path).convert("RGB")
              local = Image.open(local_path).convert("RGB")
              width = min(ref.width, local.width)
              height = min(ref.height, local.height)
              a = ref.crop((0, 0, width, height))
              b = local.crop((0, 0, width, height))
              diff = ImageChops.difference(a, b)
              stat = ImageStat.Stat(diff)
              mean = sum(stat.mean) / 3
              similarity = max(0.0, 100.0 * (1.0 - mean / 255.0))
              report[name] = {
                  "compared_width": width,
                  "compared_height": height,
                  "reference_height": ref.height,
                  "local_height": local.height,
                  "visual_similarity_percent": round(similarity, 2),
              }
              diff.save(f"visual/diff-{name}.png")

          Path = __import__("pathlib").Path
          Path("visual/report.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY

      - name: Upload visual comparison
        uses: actions/upload-artifact@v4
        with:
          name: visual-comparison
          path: visual/
          retention-days: 7
