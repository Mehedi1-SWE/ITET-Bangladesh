name: Sync ITET Committee Assets

on:
  push:
    paths:
      - ".github/workflows/sync-committee-assets.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download official portraits
