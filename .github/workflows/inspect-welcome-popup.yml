name: Inspect Live Welcome Popup

on:
  push:
    paths:
      - ".github/workflows/inspect-welcome-popup.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live welcome popup bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request
          base="https://itetbd.net"
          html=urllib.request.urlopen(base,timeout=30).read().decode("utf-8","ignore")
          scripts=sorted(set(re.findall(r'src="(/_next/static/chunks/[^"]+\.js)"',html)))
          print("SCRIPTS",len(scripts))
          needles=["Auto-closing","OFFICIAL PORTAL","Official Portal","Become A Member","Become a Partner","Welcome to ITET"]
          found=0
          for src in scripts:
              try:
                  text=urllib.request.urlopen(base+src,timeout=30).read().decode("utf-8","ignore")
              except Exception:
                  continue
              for needle in needles:
                  pos=text.find(needle)
                  if pos>=0:
                      print("\n=== CHUNK",src,"NEEDLE",needle,"AT",pos,"===")
                      print(text[max(0,pos-9000):pos+22000])
                      found+=1
          print("MATCHES",found)
          PY
